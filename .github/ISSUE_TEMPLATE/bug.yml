name: Bug report
description: Something is wrong with probloom
labels: ["needs-triage"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code or commands that show the problem.
      placeholder: |
        from probloom import BloomFilter
        f = BloomFilter(capacity=1000, error_rate=0.01)
        ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the traceback or assertion output if there is one.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: probloom version or commit
      placeholder: "0.1.0 / 78f2b03"
    validations:
      required: true
  - type: textarea
    id: ci
    attributes:
      label: Output of ./scripts/ci
      render: shell
